<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-7">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">Event Registration</h1>

            <form class="needs-validation" novalidate>
              <div class="row g-3">
                <div class="col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="fullName" placeholder="Full name" pattern="[A-Za-z ]{2,60}" required />
                    <label for="fullName">Full Name</label>
                    <div class="invalid-feedback">Name must contain only letters and spaces (2-60 characters).</div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}" minlength="6" maxlength="100" required />
                    <label for="email">Email Address</label>
                    <div class="invalid-feedback">Enter a valid email (example: name@example.com).</div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="form-floating">
                    <input type="tel" class="form-control" id="phone" placeholder="Phone number" pattern="[0-9]{10}" required />
                    <label for="phone">Phone Number</label>
                    <div class="invalid-feedback">Enter a 10-digit phone number.</div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="form-floating">
                    <select class="form-select" id="ticketType" required>
                      <option value="" selected disabled>Select a ticket</option>
                      <option value="standard">Standard</option>
                      <option value="vip">VIP</option>
                      <option value="student">Student</option>
                    </select>
                    <label for="ticketType">Ticket Type</label>
                    <div class="invalid-feedback">Please choose a ticket type.</div>
                  </div>
                </div>

                <div class="col-12 d-flex align-items-center gap-2">
                  <button type="submit" class="btn btn-primary" data-bs-toggle="tooltip" data-bs-title="Submit your registration form">
                    Register Now
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (() => {
      const emailField = document.getElementById('email');

      const validateEmail = (value) => {
        const emailRegex = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}$/;
        if (!emailRegex.test(value)) return false;
        if (value.includes('..')) return false;
        if (value.startsWith('.') || value.endsWith('.')) return false;
        return true;
      };

      emailField.addEventListener('input', () => {
        emailField.setCustomValidity(validateEmail(emailField.value) ? '' : 'Please enter a valid email address.');
      });

      const forms = document.querySelectorAll('.needs-validation');
      Array.from(forms).forEach((form) => {
        form.addEventListener('submit', (event) => {
          emailField.setCustomValidity(validateEmail(emailField.value) ? '' : 'Please enter a valid email address.');
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      });

      const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      tooltipTriggerList.map((tooltipTriggerEl) => new bootstrap.Tooltip(tooltipTriggerEl));
    })();
  </script>
</body>
</html>
